"""
Sample GraphQL schema for demonstration
"""

scalar DateTime
scalar JSON

type User {
  """User ID"""
  id: ID!
  """Full name"""
  name: String!
  """Email address"""
  email: String!
  """Created timestamp"""
  createdAt: DateTime!
  """User role"""
  role: UserRole!
  """Profile data (JSON)"""
  profile: JSON
  """Posts by this user"""
  posts(authorId: ID!): [Post!]!
}

enum UserRole {
  ADMIN
  MEMBER
  GUEST
}

type Post {
  id: ID!
  title: String!
  content: String
  author: User!
  tags: [String!]!
  status: PostStatus!
  createdAt: DateTime!
}

enum PostStatus {
  DRAFT
  PUBLISHED
  ARCHIVED
}

type Query {
  """Fetch a user by ID"""
  user(id: ID!): User
  """List all users"""
  users(role: UserRole): [User!]!
  """Fetch a post by ID"""
  post(id: ID!): Post
  """List posts"""
  posts(status: PostStatus): [Post!]!
}

type Mutation {
  """Create a new user"""
  createUser(name: String!, email: String!, role: UserRole!): User!
  """Update a user"""
  updateUser(id: ID!, name: String, email: String): User!
  """Delete a user"""
  deleteUser(id: ID!): Boolean!
  """Create a new post"""
  createPost(title: String!, content: String, authorId: ID!, tags: [String!]!): Post!
}
