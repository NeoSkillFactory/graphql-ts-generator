"""
Complex test schema with unions, interfaces, and nested features
"""

scalar Date
scalar Time
scalar GeoLocation

"""Represents a node with a unique ID"""
interface Node {
  id: ID!
}

"""Search result item that can be various types"""
union SearchResult = User | Post | Comment | Page

type User implements Node {
  id: ID!
  username: String!
  email: String!
  displayName: String
  avatar: String
  status: AccountStatus!
  verified: Boolean!
}

enum AccountStatus {
  ACTIVE
  INACTIVE
  SUSPENDED
  PENDING
}

type Post implements Node {
  id: ID!
  title: String!
  body: String!
  author: User!
  category: PostCategory!
  comments: [Comment!]!
  metadata: PostMetadata
  createdAt: Date!
  updatedAt: Date
}

enum PostCategory {
  ARTICLE
  QUESTION
  DISCUSSION
  ANNOUNCEMENT
}

type Comment implements Node {
  id: ID!
  content: String!
  author: User!
  post: Post!
  parentComment: Comment
  replies(count: Int = 10): [Comment!]!
  upvotes: Int!
  createdAt: Time!
}

type Page implements Node {
  id: ID!
  slug: String!
  title: String!
  content: String!
  lastEditor: User
  published: Boolean!
  publishedAt: Date
}

type PostMetadata {
  wordCount: Int!
  readingTime: Int!
  tags: [String!]!
  seoTitle: String
  seoDescription: String
}

input CreateUserInput {
  username: String!
  email: String!
  password: String!
  displayName: String
  role: UserRole = MEMBER
}

input UpdateUserInput {
  username: String
  email: String
  displayName: String
  avatar: String
}

enum UserRole {
  ADMIN
  MODERATOR
  MEMBER
  GUEST
}

input SearchInput {
  query: String!
  type: SearchType
  limit: Int = 20
  offset: Int = 0
}

enum SearchType {
  ALL
  USERS
  POSTS
  COMMENTS
  PAGES
}

type Query implements Node {
  id: ID!
  """Get a node by ID"""
  node(id: ID!): Node
  """Search across all content"""
  search(input: SearchInput!): [SearchResult!]!
  """Get current user"""
  me: User
  """Get user by username"""
  user(username: String!): User
  """Get post"""
  post(id: ID!): Post
  """Get page by slug"""
  page(slug: String!): Page
}

type Mutation {
  """Create user"""
  createUser(input: CreateUserInput!): User!
  """Update user"""
  updateUser(id: ID!, input: UpdateUserInput!): User!
  """Delete user"""
  deleteUser(id: ID!): Boolean!
  """Create post"""
  createPost(input: CreatePostInput!): Post!
  """Update post"""
  updatePost(id: ID!, input: UpdatePostInput!): Post!
  """Delete post"""
  deletePost(id: ID!): Boolean!
}

input CreatePostInput {
  title: String!
  body: String!
  category: PostCategory!
  tags: [String!]!
  allowComments: Boolean = true
}

input UpdatePostInput {
  title: String
  body: String
  category: PostCategory
  tags: [String!]
  allowComments: Boolean
}
